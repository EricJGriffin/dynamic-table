<div class="p-fluid" formGroup="customerForm">
    <div class="field">
      <label>Name</label>
      <input type="text" pInputText formControlName="name" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="text" pInputText formControlName="email" />
    </div>
  
    <button pButton label="Save" (click)="save()"></button>
    <button pButton label="Cancel" (click)="onHide()"></button>
  </div>
